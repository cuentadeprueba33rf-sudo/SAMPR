
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SAM | AI Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #e5e5e5;
        margin: 0;
        overflow: hidden; /* No scroll en el body */
        height: 100vh;
        height: 100dvh;
      }
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .animate-progress {
        animation: progress 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .sam-gradient {
        background: radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, transparent 70%);
      }
      /* Ajuste para que el markdown se vea bien */
      .prose strong {
        color: #ffffff !important;
        font-weight: 600 !important;
      }
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  <script type="importmap">
{

    "react": "https://esm.sh/react@^19.2.3",

    "react-markdown": "https://esm.sh/react-markdown@^9.0.1"
  }
}
</script>
</head>

  </body>
</html>
